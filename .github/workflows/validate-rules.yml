name: Validate Surge rulesets

on:
  push:
    paths:
      - "Surge/rules/**"
      - "Surge/sources/**"
      - "exports/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-rules.yml"
  pull_request:
    paths:
      - "Surge/rules/**"
      - "Surge/sources/**"
      - "exports/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-rules.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validator tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate rulesets
        run: python3 scripts/validate_rulesets.py
      - name: Check client exports
        run: python3 scripts/export_rulesets.py --check
